<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prior Attire | Vintage Coach</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Coiny&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #241b18;
      color: #fff;
      font-family: "DM Sans", sans-serif;
    }

    /* HEADER */

    header {
      background:
        radial-gradient(circle at 20% 20%, #5a4034 0 3px, transparent 4px),
        radial-gradient(circle at 80% 70%, #5a4034 0 3px, transparent 4px),
        #1c1513;

      background-size: 35px 35px;

      padding: 32px 20px 22px;

      text-align: center;

      border-bottom: 5px solid #5a4034;

      position: relative;

      overflow: hidden;

      min-height: 215px;
    }

    header::before {
      content: "";

      position: absolute;

      width: 420px;
      height: 180px;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      background: radial-gradient(
        ellipse,
        rgba(214,193,182,0.14),
        transparent 68%
      );

      animation: glowMove 5s ease-in-out infinite;

      pointer-events: none;
    }

    @keyframes glowMove {

      0%, 100% {
        transform: translateX(-50%) scale(1);
        opacity: .5;
      }

      50% {
        transform: translateX(-50%) scale(1.15);
        opacity: 1;
      }

    }

    .sparkles {
      position: absolute;

      inset: 0;

      pointer-events: none;

      z-index: 1;
    }

    .sparkle {
      position: absolute;

      color: #d6c1b6;

      font-size: 13px;

      opacity: .45;

      animation: sparkleFloat 4s ease-in-out infinite;
    }

    .sparkle:nth-child(1) {
      top: 18%;
      left: 12%;
      animation-delay: 0s;
    }

    .sparkle:nth-child(2) {
      top: 35%;
      left: 24%;
      animation-delay: .8s;
    }

    .sparkle:nth-child(3) {
      top: 15%;
      right: 16%;
      animation-delay: 1.4s;
    }

    .sparkle:nth-child(4) {
      top: 55%;
      right: 25%;
      animation-delay: 2s;
    }

    .sparkle:nth-child(5) {
      bottom: 25%;
      left: 18%;
      animation-delay: 2.6s;
    }

    .sparkle:nth-child(6) {
      bottom: 18%;
      right: 12%;
      animation-delay: 1.1s;
    }

    .sparkle:nth-child(7) {
      top: 70%;
      left: 35%;
      animation-delay: 3s;
    }

    .sparkle:nth-child(8) {
      top: 25%;
      right: 35%;
      animation-delay: 1.8s;
    }

    @keyframes sparkleFloat {

      0%, 100% {
        opacity: .2;

        transform:
          translateY(0)
          scale(.8)
          rotate(0deg);
      }

      50% {
        opacity: 1;

        transform:
          translateY(-8px)
          scale(1.35)
          rotate(20deg);
      }

    }

    .logo-area {
      position: relative;

      display: inline-block;

      z-index: 2;
    }

    .logo {
      position: relative;

      display: inline-block;

      color: #d6c1b6;

      font-family: "Allura", cursive;

      font-size: clamp(58px, 12vw, 88px);

      font-weight: 400;

      letter-spacing: 1px;

      line-height: 1;
    }

    .logo::after {
      content: "✦  ˚  ✧  ˚  ✦";

      position: absolute;

      left: 50%;

      bottom: -19px;

      transform: translateX(-50%);

      font-family: "DM Sans", sans-serif;

      font-size: 11px;

      letter-spacing: 7px;

      white-space: nowrap;

      color: #d6c1b6;

      opacity: .75;

      animation: letteringTwinkle 2.5s ease-in-out infinite;
    }

    @keyframes letteringTwinkle {

      0%, 100% {
        opacity: .4;
      }

      50% {
        opacity: 1;
      }

    }

    .logo-star {
      position: absolute;

      color: #d6c1b6;

      font-size: 14px;

      animation: logoStar 2s ease-in-out infinite;
    }

    .logo-star.one {
      top: 4px;
      left: -28px;
    }

    .logo-star.two {
      top: 34px;
      right: -38px;
      animation-delay: .5s;
    }

    .logo-star.three {
      bottom: -4px;
      left: -18px;
      animation-delay: 1s;
    }

    .logo-star.four {
      bottom: 2px;
      right: -24px;
      animation-delay: 1.5s;
    }

    @keyframes logoStar {

      0%, 100% {
        opacity: .25;

        transform:
          scale(.7)
          rotate(0deg);
      }

      50% {
        opacity: 1;

        transform:
          scale(1.35)
          rotate(25deg);
      }

    }

    .tagline {
      margin-top: 28px;

      color: #d6c1b6;

      font-size: 12px;

      letter-spacing: 3px;

      text-transform: uppercase;

      font-weight: 600;

      position: relative;

      z-index: 2;
    }

    nav {
      margin-top: 22px;

      position: relative;

      z-index: 2;
    }

    /* GLOSSY GLASS TOP BUTTONS */

    nav a {
      position: relative;

      overflow: hidden;

      display: inline-block;

      color: white;

      text-decoration: none;

      font-size: 11px;

      letter-spacing: 2px;

      margin: 0 5px;

      font-weight: 600;

      padding: 9px 16px;

      border: 1px solid rgba(255,255,255,.42);

      border-radius: 30px;

      transition: all .35s ease;

      background: rgba(255,255,255,.07);

      backdrop-filter: blur(12px);

      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        inset 0 1px 3px rgba(255,255,255,.38),
        inset 0 -1px 2px rgba(0,0,0,.14),
        0 4px 12px rgba(0,0,0,.12);
    }

    nav a::before {
      content: "";

      position: absolute;

      top: 0;
      left: 8%;

      width: 84%;
      height: 48%;

      background: linear-gradient(
        to bottom,
        rgba(255,255,255,.30),
        rgba(255,255,255,.04)
      );

      border-radius: 30px;

      pointer-events: none;
    }

    nav a:hover {
      color: #fff;

      border-color: rgba(255,255,255,.7);

      background: rgba(255,255,255,.16);

      transform: translateY(-2px);

      box-shadow:
        inset 0 1px 3px rgba(255,255,255,.5),
        0 5px 14px rgba(0,0,0,.2);
    }


    /* HERO */

    .hero {

      background:
        radial-gradient(circle at 10% 15%, #5a4034 0 2px, transparent 3px),
        radial-gradient(circle at 25% 15%, #5a4034 0 2px, transparent 3px),
        radial-gradient(circle at 40% 15%, #5a4034 0 2px, transparent 3px),
        radial-gradient(circle at 55% 15%, #5a4034 0 2px, transparent 3px),
        radial-gradient(circle at 70% 15%, #5a4034 0 2px, transparent 3px),
        radial-gradient(circle at 85% 15%, #5a4034 0 2px, transparent 3px),

        radial-gradient(circle at 10% 50%, #5a4034 0 2px, transparent 3px),
        radial-gradient(circle at 25% 50%, #5a4034 0 2px, transparent 3px),
        radial-gradient(circle at 40% 50%, #5a4034 0 2px, transparent 3px),
        radial-gradient(circle at 55% 50%, #5a4034 0
